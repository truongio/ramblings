<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ramblings and musings — essays, poems, recipes, and small projects by Truong." />
    <title>index</title>

    <meta name="theme-color" content="#fffbf4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />

    <link rel="preload" href="fonts/Exposure_VAR.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/Exposure_VAR-650.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/site.css" />

    <!-- Pre-paint: honour a saved theme before the first frame, so a manual
         override never flashes the other palette. Inline and synchronous on
         purpose — a deferred file would arrive a repaint too late. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>

  <body class="index-page">
    <main class="container index-main">
      <!-- data-label repeats the link text: it renders the bold twin that
           fades in on hover. Keep the two in step when editing. -->
      <nav class="menu-container" aria-label="index">
        <a class="menu-link" href="https://recipes.truongio.dev" data-label="recipes">recipes</a><br />
        <a class="menu-link" href="https://rank.truongio.dev/u/truong" data-label="rank">rank</a><br />
        <a class="menu-link" href="https://recommendations.truongio.dev" data-label="recommendations">recommendations</a><br />
        <a class="menu-link" href="https://travel.truongio.dev" data-label="travel">travel</a><br />
        <a class="menu-link" href="https://numbers.truongio.dev" data-label="numbers">numbers</a><br />
        <a class="menu-link" href="https://tracker.truongio.dev" data-label="tracker">tracker</a><br />
        <a class="menu-link" href="https://systems.truongio.dev" data-label="systems">systems</a><br />
        <a class="menu-link" href="https://expenses.truongio.dev" data-label="expenses">expenses</a><br />
        <a class="menu-link" href="https://void.truongio.dev" data-label="void">void</a><br />
      </nav>
    </main>
    <script defer src="js/site.js"></script>
    <script defer src="js/theme.js"></script>
  </body>
</html>
